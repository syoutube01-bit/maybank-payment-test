<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maybank Payment Test</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; min-height: 100svh; margin: 0; padding: 24px 16px; background: #f5f5f5; }
        h2 { margin: 0 0 24px; max-width: 100%; font-size: 24px; text-align: center; overflow-wrap: anywhere; }
        button { width: 240px; max-width: 100%; min-height: 48px; padding: 16px; margin: 8px 0; font-size: 18px; font-family: inherit; border: none; border-radius: 8px; background: #ffc20e; cursor: pointer; }
        button:focus-visible { outline: 3px solid #17324d; outline-offset: 3px; }
        @media (max-width: 480px) {
            button { width: 100%; max-width: 360px; }
            h2 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <h2>Select Payment Type</h2>
    <button id="dpBtn">DP</button>
    <button id="pntBtn">PNT</button>
    <script>
        const search = window.location.search;
        document.getElementById("pntBtn").onclick = () => {
            window.location.href = "/PNTOrderCreation.html" + search;
        };
        document.getElementById("dpBtn").onclick = () => {
            window.location.href = "/DPLandingScreen.html" + search;
        };
    </script>
</body>
</html>
