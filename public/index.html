<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Maybank Payment Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 32px 24px;
            background: #f2f5f7;
            color: #263238;
        }

        h2 {
            color: #17324d;
        }

        label {
            font-weight: bold;
        }

        .hidden-field {
            display: none;
        }

        button {
            padding: 14px 24px;
            border: 0;
            border-radius: 8px;
            background: #ffce00;
            color: #17324d;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(23, 50, 77, 0.14);
        }

        button:active {
            transform: translateY(1px);
        }

        pre {
            background: #fff;
            color: #263238;
            padding: 15px;
            border: 1px solid #dce4e9;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .loader-overlay {
            display: none;
            position: fixed;
            inset: 0;
            align-items: center;
            justify-content: center;
            background: rgba(23, 50, 77, 0.2);
            z-index: 1000;
        }

        .loader-overlay.visible {
            display: flex;
        }

        .loader-spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #dce4e9;
            border-top-color: #ffce00;
            border-radius: 50%;
            animation: loader-spin 0.8s linear infinite;
        }

        @keyframes loader-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

<h2>Maybank Payment Order Test - 2</h2>

<label class="hidden-field">WebInit Token</label>

<input
    class="hidden-field"
    type="text"
    id="webinitToken"
    placeholder="Enter webinitToken"
/>

<label class="hidden-field">Amount</label>

<input
    class="hidden-field"
    type="number"
    id="amount"
    value="100"
/>


<button onclick="createOrder()">
    Create Payment Order
</button>

<h3>Response</h3>

<pre id="response"></pre>

<div class="loader-overlay" id="loaderOverlay">
    <div class="loader-spinner"></div>
</div>

<script>

// navigator.userAgent is overridden to "Maybank-MY" by SecureWebView, so it can't
// tell iOS from Android; navigator.platform is untouched by that override.
function detectNativePlatform() {
    var platform = (navigator.platform || "").toLowerCase();
    if (/iphone|ipad|ipod|mac/.test(platform)) return "ios";
    if (/linux|android/.test(platform)) return "android";
    return "unknown";
}

console.log("[PlatformCheck] navigator.platform:", navigator.platform, "->", detectNativePlatform());

// WEB_INIT_TOKEN is pulled on demand from the SecureWebView bridge (never
// injected on window), so the native layer can verify origin and re-mint
// an expired token on each request.
function readWebInitToken() {
    if (!window.nativeMessageService) return Promise.resolve("");
    return window.nativeMessageService
        .callAPI("GET_INIT_TOKEN", {})
        .then(function (res) {
            return (res && res.webInitToken) || "";
        })
        .catch(function () {
            return "";
        });
}

// Prefill the input from the bridge when hosted inside the app's WebView;
// the field stays editable for standalone browser testing.
window.addEventListener("DOMContentLoaded", function () {
    readWebInitToken().then(function (webInitToken) {
        if (webInitToken) {
            document.getElementById("webinitToken").value = webInitToken;
        }
    });
});

// Random digits matching the "20260914948" (11-digit) reference shape.
function buildPartnerInvoiceId() {
    let digits = "";
    for (let i = 0; i < 11; i++) {
        digits += Math.floor(Math.random() * 10);
    }
    return "INV" + digits;
}

// Calls the platform-specific redirection URL returned by create-order on success.
function triggerRedirection(url) {
    const deepLinkUrl = url.replace(/^https:\/\//, "m2ulife://");
    console.log("[Redirection] Opening deep link:", deepLinkUrl);
    try {
        window.location.href = deepLinkUrl;
    } catch (error) {
        console.warn("[Redirection] Failed to open deep link URL:", deepLinkUrl, error);
    }
}

async function createOrder() {

    const webinitToken =
        document.getElementById("webinitToken").value ||
        (await readWebInitToken());

    const amount =
        Number(document.getElementById("amount").value);

    if (!webinitToken) {
        alert("Please enter webinitToken");
        return;
    }

    const loaderOverlay = document.getElementById("loaderOverlay");
    loaderOverlay.classList.add("visible");

    const requestBody = {

        webinitToken: webinitToken,

        partnerInvoiceId:
            buildPartnerInvoiceId(),

        partnerReferenceId:
            "REF20260522",

        currency:
            "MYR",

        amount:
            amount,

        remark:
            "New Payment order"
    };

    try {

        const response = await fetch(
            "/api/create-order",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(requestBody)
            }
        );

        const data =
            await response.json();

        document.getElementById(
            "response"
        ).textContent =
            JSON.stringify(data, null, 2);

        console.log("[Rajan] " + data + " -> " + response.status, data);
        try {
        if (data && data.success) {
            const platform = detectNativePlatform();
            console.log("[Rajan] Platform detected: " + platform);
            const redirection = data.data && data.data.redirection;
            console.log("[Rajan] redirection: " + redirection);
            let redirectionUrl = "";
            if (redirection) {
                if (platform === "ios") {
                    redirectionUrl = redirection.ios;
                } else {
                    redirectionUrl = redirection.android;
                }
            }

            console.log("[Rajan] redirectionUrl: " + redirectionUrl);

            if (redirectionUrl) {
                triggerRedirection(redirectionUrl);
            } else {
                console.warn("[Redirection] No redirection URL for platform:", platform);
            }
        }
        } catch (error) {
            console.error("[Rajan] Error processing redirection:", error);
        }

    } catch (error) {

        document.getElementById(
            "response"
        ).textContent =
            error.toString();
    } finally {
        loaderOverlay.classList.remove("visible");
    }
}

</script>

</body>
</html>
