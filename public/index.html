<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Maybank Payment Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }

        pre {
            background: #f5f5f5;
            padding: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<h2>Maybank Payment Order Test - 1</h2>

<label>WebInit Token</label>

<input
    type="text"
    id="webinitToken"
    placeholder="Enter webinitToken"
/>

<label>Amount</label>

<input
    type="number"
    id="amount"
    value="100"
/>

<button onclick="createOrder()">
    Create Payment Order
</button>

<h3>Response</h3>

<pre id="response"></pre>

<script>

// WEB_INIT_TOKEN is pulled on demand from the SecureWebView bridge (never
// injected on window), so the native layer can verify origin and re-mint
// an expired token on each request.
function readWebInitToken() {
    if (!window.nativeMessageService) return Promise.resolve("");
    return window.nativeMessageService
        .callAPI("GET_INIT_TOKEN", {})
        .then(function (res) {
            return (res && res.webInitToken) || "";
        })
        .catch(function () {
            return "";
        });
}

// Prefill the input from the bridge when hosted inside the app's WebView;
// the field stays editable for standalone browser testing.
window.addEventListener("DOMContentLoaded", function () {
    readWebInitToken().then(function (webInitToken) {
        if (webInitToken) {
            document.getElementById("webinitToken").value = webInitToken;
        }
    });
});

// Random digits matching the "20260914948" (11-digit) reference shape.
function buildPartnerInvoiceId() {
    let digits = "";
    for (let i = 0; i < 11; i++) {
        digits += Math.floor(Math.random() * 10);
    }
    return "INV" + digits;
}

async function createOrder() {

    const webinitToken =
        document.getElementById("webinitToken").value ||
        (await readWebInitToken());

    const amount =
        Number(document.getElementById("amount").value);

    if (!webinitToken) {
        alert("Please enter webinitToken");
        return;
    }

    const requestBody = {

        webinitToken: webinitToken,

        partnerInvoiceId:
            buildPartnerInvoiceId(),

        partnerReferenceId:
            "REF20260522",

        currency:
            "MYR",

        amount:
            amount,

        remark:
            "New Payment order"
    };

    try {

        const response = await fetch(
            "/api/create-order",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(requestBody)
            }
        );

        const data =
            await response.json();

        document.getElementById(
            "response"
        ).textContent =
            JSON.stringify(data, null, 2);

    } catch (error) {

        document.getElementById(
            "response"
        ).textContent =
            error.toString();
    }
}

</script>

</body>
</html>
