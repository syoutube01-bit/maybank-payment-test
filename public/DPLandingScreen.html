<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DP Landing Screen</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; min-height: 100vh; min-height: 100svh; margin: 0 auto; max-width: 1280px; padding: 24px; background: #f5f5f5; }
        .layout { display: grid; grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); gap: 32px; align-items: start; }
        .left { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
        .right { min-width: 0; padding: 16px; background: #fff; border-radius: 8px; }
        h2 { margin: 0 0 24px; font-size: 24px; overflow-wrap: anywhere; }
        h3 { margin: 0 0 16px; font-size: 18px; }
        button { width: 100%; min-height: 48px; padding: 16px; font-size: 16px; line-height: 1.4; font-family: inherit; overflow-wrap: anywhere; border: none; border-radius: 8px; background: #ffc20e; cursor: pointer; }
        button:focus-visible { outline: 3px solid #17324d; outline-offset: 3px; }
        #response { margin: 0; min-height: 120px; max-width: 100%; font-size: 14px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
        @media (max-width: 768px) {
            body { padding: 20px 16px; }
            .layout { grid-template-columns: minmax(0, 1fr); gap: 24px; }
            h2 { font-size: 22px; margin-bottom: 20px; }
            button { padding: 14px 16px; }
        }
    </style>
</head>
<body>
    <h2>DP Landing Screen</h2>
    <div class="layout">
        <div class="left">
            <button id="createOrderBtn">Create Order</button>
            <button id="viewPartyBtn">View Party</button>
            <button id="getByOrderRefBtn">Get Order by Order Reference Id</button>
            <button id="getByInvoiceBtn">Get Order by Partner Invoice Id</button>
        </div>
        <div class="right">
            <h3>Response</h3>
            <pre id="response" aria-live="polite"></pre>
        </div>
    </div>
<script>
const DP_ORDERS_URL = "/api/dp/create-order";
let accessToken = "";
let tokenRequest = null;
const DP_CREATE_ORDER_BODY = {
    "partnerReferenceId": "REF20260522",
    "currency": "MYR",
    "amount": 100,
    "remark": "New Payment order"
};

function buildPartnerInvoiceId() {
    let digits = "";
    for (let i = 0; i < 11; i++) {
        digits += Math.floor(Math.random() * 10);
    }
    return "INV" + digits;
}

function detectNativePlatform() {
    const platform = (navigator.platform || "").toLowerCase();
    if (/iphone|ipad|ipod|mac/.test(platform)) return "ios";
    if (/linux|android/.test(platform)) return "android";
    return "unknown";
}

function triggerRedirection(url) {
    const deepLinkUrl = url.replace(/^https:\/\//, "m2ulife://");
    try {
        window.location.href = deepLinkUrl;
    } catch (error) {
        console.warn("[Redirection] Failed to open deep link URL:", deepLinkUrl, error);
    }
}

function readWebInitToken() {
    if (!window.nativeMessageService) return Promise.resolve("");
    return window.nativeMessageService
        .callAPI("GET_INIT_TOKEN", {})
        .then(function (res) { return (res && res.webInitToken) || ""; })
        .catch(function () { return ""; });
}

async function createOrder() {
    const out = document.getElementById("response");
    out.textContent = "Loading...";
    try {
        await getToken();
        const webinitToken = await readWebInitToken();
        const res = await fetch(DP_ORDERS_URL, {
            method: "POST",
            headers: {
                "Content-Type": "text/plain",
                "x-webinit-token": webinitToken,
                "x-access-token": accessToken
            },
            body: JSON.stringify({
                ...DP_CREATE_ORDER_BODY,
                partnerInvoiceId: buildPartnerInvoiceId()
            })
        });
        const text = await res.text();
        out.textContent = "HTTP " + res.status + "\n" + text;

        let data;
        try {
            data = JSON.parse(text);
        } catch (error) {
            return;
        }

        if (res.ok && data.statusCode === "0000") {
            const platform = detectNativePlatform();
            const redirection = data.redirection;
            const redirectionUrl = redirection
                ? platform === "ios" ? redirection.ios : redirection.android
                : "";

            if (redirectionUrl) {
                triggerRedirection(redirectionUrl);
            } else {
                console.warn("[Redirection] No redirection URL for platform:", platform);
            }
        }
    } catch (error) {
        out.textContent = "Request failed: " + error.message;
    }
}

async function viewParty() {
    const out = document.getElementById("response");
    out.textContent = "Loading...";
    try {
        await getToken();
        const webinitToken = await readWebInitToken();
        const res = await fetch("/api/dp/view-party", {
            method: "GET",
            headers: { "x-webinit-token": webinitToken, "x-access-token": accessToken }
        });
        const text = await res.text();
        out.textContent = "HTTP " + res.status + "\n" + text;
    } catch (error) {
        out.textContent = "Request failed: " + error.message;
    }
}

async function getOrderByRefId() {
    const orderRefId = prompt("Enter Order Reference Id", "MBB393");
    if (!orderRefId) return;

    const out = document.getElementById("response");
    out.textContent = "Loading...";
    try {
        await getToken();
        const webinitToken = await readWebInitToken();
        const res = await fetch("/api/dp/order-status?orderRefId=" + encodeURIComponent(orderRefId), {
            method: "GET",
            headers: { "x-webinit-token": webinitToken, "x-access-token": accessToken }
        });
        const text = await res.text();
        out.textContent = "HTTP " + res.status + "\n" + text;
    } catch (error) {
        out.textContent = "Request failed: " + error.message;
    }
}

async function getOrderByInvoiceId() {
    const partnerInvoiceId = prompt("Enter Partner Invoice Id", "INV20260914212");
    if (!partnerInvoiceId) return;

    const out = document.getElementById("response");
    out.textContent = "Loading...";
    try {
        await getToken();
        const webinitToken = await readWebInitToken();
        const res = await fetch("/api/dp/order-by-invoice?partnerInvoiceId=" + encodeURIComponent(partnerInvoiceId), {
            method: "GET",
            headers: { "x-webinit-token": webinitToken, "x-access-token": accessToken }
        });
        const text = await res.text();
        out.textContent = "HTTP " + res.status + "\n" + text;
    } catch (error) {
        out.textContent = "Request failed: " + error.message;
    }
}

function getToken() {
    if (accessToken) return Promise.resolve(accessToken);
    if (tokenRequest) return tokenRequest;

    tokenRequest = fetch("/api/dp/token", { method: "POST" }).then(async res => {
        const text = await res.text();
        if (!res.ok) {
            throw new Error("Get Token: HTTP " + res.status + "\n" + text);
        }
        const data = JSON.parse(text);
        const token = data?.responseData?.access_token;
        if (data?.txnStatus?.code !== "AOK200" || typeof token !== "string" || !token.trim()) {
            throw new Error("Get Token returned no valid access token: " + text);
        }
        accessToken = token;
        return token;
    }).finally(() => {
        tokenRequest = null;
    });
    return tokenRequest;
}

document.getElementById("createOrderBtn").addEventListener("click", createOrder);
document.getElementById("viewPartyBtn").addEventListener("click", viewParty);
document.getElementById("getByOrderRefBtn").addEventListener("click", getOrderByRefId);
document.getElementById("getByInvoiceBtn").addEventListener("click", getOrderByInvoiceId);
</script>
</body>
</html>
