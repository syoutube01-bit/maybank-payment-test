<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders</title>
    <link rel="stylesheet" href="/my-orders.css">
</head>
<body class="orders-page">
    <main class="page">
        <header class="page-header">
            <a class="back-link" id="backLink" href="/">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="m15 18-6-6 6-6" />
                </svg>
                <span>Back</span>
            </a>
            <p class="partner-name" id="partnerName"></p>
        </header>
        <section class="my-orders" id="myOrders" aria-labelledby="myOrdersHeading" hidden>
            <div class="my-orders-header">
                <div class="my-orders-heading">
                    <p class="eyebrow">ORDER ACTIVITY</p>
                    <h1 id="myOrdersHeading">My Orders</h1>
                    <p class="my-orders-description">View and manage your recent payments in one place.</p>
                </div>
                <button class="my-orders-refresh" type="button" aria-label="Refresh my orders" title="Refresh my orders">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M20 7v5h-5M4 17v-5h5M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"/>
                    </svg>
                </button>
            </div>
            <p class="my-orders-message" role="status" aria-live="polite"></p>
            <ul class="my-orders-list"></ul>
        </section>
    </main>
    <script src="/payment-session.js"></script>
    <script>
        (() => {
            const partnerNames = {
                "mbb-mae-ctos": "CTOS",
                "mbb-mae-easybook": "Easybook",
                "mbb-mae-esim": "eSIM"
            };
            const partnerId = new URLSearchParams(window.location.search).get("partnerId") || "";
            const partnerName = Object.hasOwn(partnerNames, partnerId) ? partnerNames[partnerId] : "";
            document.getElementById("myOrders").dataset.partnerId = partnerId;
            document.getElementById("partnerName").textContent = partnerName;
            document.title = partnerName ? partnerName + " | My Orders" : "My Orders";
            // "/" redirects back to the partner landing page, keeping the original query string.
            document.getElementById("backLink").href = "/" + window.location.search;
        })();
    </script>
    <script src="/my-orders.js"></script>
</body>
</html>
