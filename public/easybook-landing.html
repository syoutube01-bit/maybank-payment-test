<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f1e7">
    <title>Easybook | Your next journey</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            color: #173c32;
            font-family: "Trebuchet MS", Arial, sans-serif;
            background: #f5f1e7;
        }
        a { color: inherit; }
        .site-header {
            display: flex;
            max-width: 1280px;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            margin: 0 auto;
            padding: 26px 48px;
        }
        .wordmark {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 23px;
            font-weight: 800;
            letter-spacing: -1.2px;
            text-decoration: none;
        }
        .wordmark-icon {
            display: grid;
            width: 34px;
            height: 34px;
            place-items: center;
            border-radius: 50% 50% 50% 10px;
            color: #f5f1e7;
            font-size: 19px;
            background: #18724e;
            transform: rotate(-8deg);
        }
        .api-test {
            display: inline-flex;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            padding: 0 19px;
            border: 1px solid #b5c3b8;
            border-radius: 999px;
            color: #173c32;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            transition: background-color 160ms ease, color 160ms ease;
        }
        .api-test:hover { color: #fff; background: #173c32; }
        .journey {
            display: grid;
            width: min(1184px, calc(100% - 96px));
            min-height: min(720px, calc(100svh - 94px));
            grid-template-columns: 1fr 0.93fr;
            align-items: center;
            gap: 56px;
            margin: 0 auto;
            padding: 20px 0 70px;
        }
        .eyebrow {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 24px;
            color: #597465;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .eyebrow::before {
            width: 26px;
            height: 2px;
            content: "";
            background: #ed7a43;
        }
        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(58px, 8vw, 104px);
            font-weight: 400;
            letter-spacing: -6px;
            line-height: 0.94;
        }
        .headline {
            max-width: 530px;
            margin: 19px 0 20px;
            color: #ed7a43;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(29px, 4vw, 45px);
            font-style: italic;
            letter-spacing: -1.8px;
            line-height: 1.12;
        }
        .intro {
            max-width: 430px;
            margin: 0;
            color: #62756b;
            font-size: 17px;
            line-height: 1.75;
        }
        .primary-link {
            display: inline-flex;
            min-height: 56px;
            align-items: center;
            gap: 18px;
            margin-top: 32px;
            padding: 0 24px;
            border-radius: 4px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            background: #18724e;
            box-shadow: 0 8px 18px #173c3224;
            cursor: pointer;
            font-family: inherit;
            transition: background-color 160ms ease, transform 160ms ease;
        }
        .primary-link:hover { background: #105d3d; transform: translateY(-2px); }
        .primary-link:disabled { opacity: .65; cursor: wait; transform: none; }
        .arrow { font-size: 20px; line-height: 1; }
        #paymentStatus {
            max-width: 430px;
            margin: 16px 0 0;
            color: #62756b;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }
        .artwork {
            position: relative;
            display: grid;
            min-height: 490px;
            place-items: center;
            overflow: hidden;
            border-radius: 48% 48% 8px 8px;
            background: #dfe7d5;
        }
        .sun {
            position: absolute;
            top: 45px;
            right: 54px;
            width: 112px;
            height: 112px;
            border-radius: 50%;
            background: #f3b86b;
        }
        .hill {
            position: absolute;
            right: -12%;
            bottom: -3%;
            left: -12%;
            height: 45%;
            border-radius: 50% 50% 0 0;
            background: #a8c49c;
            transform: rotate(-8deg);
        }
        .hill-back {
            bottom: 12%;
            left: -25%;
            height: 35%;
            background: #c0d0ae;
            transform: rotate(11deg);
        }
        .road {
            position: absolute;
            right: 8%;
            bottom: -22%;
            width: 41%;
            height: 91%;
            border: 4px solid #f5f1e7;
            border-radius: 50%;
            transform: rotate(32deg);
        }
        .travel-card {
            position: relative;
            z-index: 1;
            width: min(78%, 350px);
            margin-top: 52px;
            padding: 25px 25px 22px;
            border: 1px solid #fff;
            border-radius: 8px;
            background: #fffdf8;
            box-shadow: 0 22px 55px #25483126;
            transform: rotate(-4deg);
        }
        .card-label {
            margin: 0 0 23px;
            color: #7a8c80;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .route {
            display: grid;
            grid-template-columns: 1fr 38px 1fr;
            align-items: center;
            gap: 8px;
        }
        .route-stop strong {
            display: block;
            color: #173c32;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 21px;
            font-weight: 400;
        }
        .route-stop span {
            display: block;
            margin-top: 4px;
            color: #89948b;
            font-size: 11px;
        }
        .route-line {
            height: 1px;
            background: #ed7a43;
        }
        .route-line::after {
            display: block;
            width: 7px;
            height: 7px;
            margin: -3px 0 0 auto;
            border-radius: 50%;
            content: "";
            background: #ed7a43;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 23px;
            padding-top: 15px;
            border-top: 1px dashed #d7ddd4;
            color: #687a6e;
            font-size: 11px;
        }
        a:focus-visible {
            outline: 3px solid #ed7a43;
            outline-offset: 4px;
        }
        button:focus-visible {
            outline: 3px solid #ed7a43;
            outline-offset: 4px;
        }
        @media (max-width: 760px) {
            .site-header { padding: 20px 24px; }
            .journey {
                width: min(560px, calc(100% - 48px));
                min-height: auto;
                grid-template-columns: 1fr;
                gap: 38px;
                padding: 45px 0 54px;
            }
            .artwork { min-height: 390px; }
            h1 { letter-spacing: -4px; }
        }
        @media (max-width: 420px) {
            .site-header { padding: 16px 20px; }
            .wordmark { font-size: 20px; }
            .api-test { min-height: 40px; padding: 0 14px; }
            .journey { width: calc(100% - 40px); padding-top: 35px; }
            .artwork { min-height: 330px; }
            .travel-card { width: 84%; padding: 20px; }
            .route-stop strong { font-size: 18px; }
            .sun { top: 32px; right: 30px; width: 82px; height: 82px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="wordmark" href="#" aria-label="Easybook home">
            <span class="wordmark-icon" aria-hidden="true">e</span>
            <span>easybook</span>
        </a>
        <a class="api-test" id="apiTestLink" href="/index.html">API test</a>
    </header>
    <main class="journey">
        <section aria-label="Easybook landing">
            <p class="eyebrow">Make the journey yours</p>
            <h1>Easybook</h1>
            <p class="headline">A better way to get there.</p>
            <p class="intro">Find your way to the places you want to go. Your next journey starts with a simpler plan.</p>
            <button class="primary-link" id="buyButton" type="button" disabled>
                <span>Buy Book</span>
                <span class="arrow" aria-hidden="true">↗</span>
            </button>
            <p id="paymentStatus" role="status" aria-live="polite"></p>
        </section>
        <div class="artwork" aria-hidden="true">
            <div class="sun"></div>
            <div class="hill hill-back"></div>
            <div class="hill"></div>
            <div class="road"></div>
            <div class="travel-card">
                <p class="card-label">A little more out there</p>
                <div class="route">
                    <div class="route-stop"><strong>Here</strong><span>Where you are</span></div>
                    <div class="route-line"></div>
                    <div class="route-stop"><strong>There</strong><span>Where you could be</span></div>
                </div>
                <div class="card-footer"><span>Bus · Train · Ferry</span><span>Your next story</span></div>
            </div>
        </div>
    </main>
    <script src="/payment-session.js"></script>
    <script>
        const apiTestLink = document.getElementById("apiTestLink");
        apiTestLink.href += window.location.search;
        const buyButton = document.getElementById("buyButton");
        const paymentStatus = document.getElementById("paymentStatus");
        let isBuying = false;

        function updateBuyButton() {
            buyButton.disabled = isBuying;
        }

        function buildPartnerInvoiceId() {
            let digits = "";
            for (let i = 0; i < 11; i++) {
                digits += Math.floor(Math.random() * 10);
            }
            return "INV" + digits;
        }

        function detectNativePlatform() {
            const platform = (navigator.platform || "").toLowerCase();
            if (/iphone|ipad|ipod|mac/.test(platform)) return "ios";
            if (/linux|android/.test(platform)) return "android";
            return "unknown";
        }

        function triggerRedirection(url) {
            window.location.href = url.replace(/^https:\/\//, "m2ulife://");
        }

        async function getToken() {
            const res = await fetch("/api/dp/token", { method: "POST" });
            const text = await res.text();
            if (!res.ok) {
                throw new Error("Get Token: HTTP " + res.status + "\n" + text);
            }
            const data = JSON.parse(text);
            const token = data.responseData?.access_token;
            if (data.txnStatus?.code !== "AOK200" || typeof token !== "string" || !token.trim()) {
                throw new Error("Get Token returned no valid access token: " + text);
            }
            return token;
        }

        async function createOrder(accessToken) {
            const webInitToken = await window.paymentSession.getWebInitToken();
            const res = await fetch("/api/dp/create-order", {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain",
                    "x-webinit-token": webInitToken,
                    "x-access-token": accessToken
                },
                body: JSON.stringify({
                    partnerReferenceId: "REF20260522",
                    currency: "MYR",
                    amount: 100,
                    remark: "Easybook",
                    partnerInvoiceId: buildPartnerInvoiceId()
                })
            });
            const text = await res.text();
            if (!res.ok) {
                throw new Error("Create Order: HTTP " + res.status + "\n" + text);
            }
            const data = JSON.parse(text);
            if (data.statusCode !== "0000") {
                throw new Error("Create Order failed: " + text);
            }
            const platform = detectNativePlatform();
            const redirectionUrl = platform === "ios" ? data.redirection?.ios : data.redirection?.android;
            if (typeof redirectionUrl !== "string" || !redirectionUrl.trim()) {
                throw new Error("No redirection URL for platform: " + platform);
            }
            triggerRedirection(redirectionUrl);
        }

        updateBuyButton();
        buyButton.addEventListener("click", async () => {
            if (isBuying) return;
            isBuying = true;
            updateBuyButton();
            paymentStatus.textContent = "Getting payment token...";
            try {
                const accessToken = await getToken();
                paymentStatus.textContent = "Creating order...";
                await createOrder(accessToken);
                paymentStatus.textContent = "Redirecting to payment...";
            } catch (error) {
                paymentStatus.textContent = "Payment failed: " + error.message;
            } finally {
                isBuying = false;
                updateBuyButton();
            }
        });
    </script>
</body>
</html>
