<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Payment Status</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 25%, #ff9a9e 50%, #a18cd1 75%, #7ad7f0 100%);
            color: #111;
            padding: 24px;
        }

        .status-box {
            width: 100%;
            max-width: 520px;
            text-align: center;
            background: rgba(255, 255, 255, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 40px 24px;
            box-shadow: 0 22px 55px rgba(53, 18, 95, 0.18);
        }

        .status-text {
            margin: 0;
            font-size: clamp(2rem, 5vw, 3.5rem);
            line-height: 1.2;
            font-weight: 800;
            color: #1d1b2a;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.25);
        }

        .amount-text {
            margin-top: 38px;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            color: #1c1d2f;
        }
    </style>
</head>

<body>

<div class="status-box">
    <h1 class="status-text" id="statusText">Payment Status</h1>
    <div class="amount-text" id="amountText"></div>
</div>

<script>

function getQueryParam(name) {
    const params = new URLSearchParams(window.location.search);
    const value = params.get(name);

    if (!value || value === "null" || value === "undefined") {
        return "";
    }

    return value.trim();
}

window.addEventListener("DOMContentLoaded", function () {
    const status = getQueryParam("status");
    const amount = getQueryParam("amount");

    const statusTextEl = document.getElementById("statusText");
    const amountTextEl = document.getElementById("amountText");

    statusTextEl.textContent = status || "Payment Status";

    if (amount) {
        amountTextEl.textContent = "Amount: " + amount;
        amountTextEl.style.display = "block";
    } else {
        amountTextEl.textContent = "";
        amountTextEl.style.display = "none";
    }
});

</script>

</body>
</html>
