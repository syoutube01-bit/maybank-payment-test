<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f6f8">

    <title>Payment Status</title>

    <link rel="stylesheet" href="/payment-status.css">
</head>

<body>

<main class="status-shell">
    <div class="brand-row">
        <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 9h16M6 9v8m4-8v8m4-8v8m4-8v8M4 20h16M3 9l9-6 9 6" /></svg>
        </span>
        <span>Payment</span>
    </div>
    <section class="status-box" aria-labelledby="statusText">
        <p class="status-kicker">PAYMENT RECEIPT</p>
        <h1 class="status-text" id="statusText">Payment Status</h1>
        <p class="message" id="message" role="status" aria-live="polite">Loading order details...</p>
        <h2 class="details-heading" id="detailsHeading" hidden>Order details</h2>
        <dl class="order-details" id="orderDetails" aria-labelledby="detailsHeading" hidden>
            <div class="detail-row"><dt>Order Reference Id</dt><dd id="orderRefId"></dd></div>
            <div class="detail-row"><dt>Partner Reference Id</dt><dd id="partnerReferenceId"></dd></div>
            <div class="detail-row"><dt>Partner Invoice Id</dt><dd id="partnerInvoiceId"></dd></div>
            <div class="detail-row"><dt>Amount</dt><dd id="amount"></dd></div>
            <div class="detail-row"><dt>Date</dt><dd><time id="createdAt"></time></dd></div>
            <div class="detail-row"><dt>Payment Status</dt><dd id="paymentStatus"></dd></div>
        </dl>
    </section>
</main>

<script>

function getQueryParam(name) {
    const params = new URLSearchParams(window.location.search);
    const value = params.get(name);

    if (!value || value === "null" || value === "undefined") {
        return "";
    }

    return value.trim();
}

window.addEventListener("DOMContentLoaded", async function () {
    const message = document.getElementById("message");
    const orderDetails = document.getElementById("orderDetails");
    const detailsHeading = document.getElementById("detailsHeading");
    const orderId = getQueryParam("orderId") || getQueryParam("oid");
    if (!orderId) {
        message.textContent = "An orderId is required to load payment details.";
        message.classList.add("error");
        return;
    }
    const orderRefId = orderId.startsWith("MBB") ? orderId : "MBB" + orderId;

    try {
        const response = await fetch("/api/local/orders/" + encodeURIComponent(orderRefId));
        const result = await response.json();
        if (!response.ok || !result.success) {
            throw new Error(result.message || "Unable to load order details.");
        }
        const order = result.data;
        for (const field of ["orderRefId", "partnerReferenceId", "partnerInvoiceId", "paymentStatus"]) {
            document.getElementById(field).textContent = order[field];
        }
        const paymentStatus = document.getElementById("paymentStatus");
        const normalizedStatus = String(order.paymentStatus || "").trim().toUpperCase();
        if (normalizedStatus === "SUCCESS") {
            paymentStatus.classList.add("status-success");
        } else if (["REJECT", "REJECTED", "CANCEL", "CANCELLED", "CANCELED"].includes(normalizedStatus)) {
            paymentStatus.classList.add("status-error");
        }
        document.getElementById("amount").textContent = order.currency + " " + order.amount;
        const createdAt = order.createdAt ? new Date(order.createdAt) : null;
        if (createdAt && Number.isFinite(createdAt.getTime())) {
            const createdAtElement = document.getElementById("createdAt");
            createdAtElement.dateTime = createdAt.toISOString();
            createdAtElement.textContent = createdAt.toISOString().slice(0, 10);
        }
        orderDetails.hidden = false;
        detailsHeading.hidden = false;
        message.hidden = true;
    } catch (error) {
        console.error("Unable to load payment details:", error);
        message.textContent = error.message;
        message.classList.add("error");
    }
});

</script>

</body>
</html>
