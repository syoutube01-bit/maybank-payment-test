<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Payment Status</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f2f5f7;
            color: #263238;
            padding: 24px;
        }

        .status-box {
            width: 100%;
            max-width: 520px;
            text-align: center;
            background: #fff;
            border: 1px solid #dce4e9;
            border-radius: 10px;
            padding: 40px 24px;
            box-shadow: 0 12px 28px rgba(23, 50, 77, 0.1);
        }

        .status-text {
            margin: 0;
            font-size: clamp(2rem, 5vw, 3.5rem);
            line-height: 1.2;
            font-weight: 800;
            color: #17324d;
        }

        .amount-text {
            margin-top: 38px;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            color: #4d6475;
        }
    </style>
</head>

<body>

<div class="status-box">
    <h1 class="status-text" id="statusText">Payment Status</h1>
    <div class="amount-text" id="amountText"></div>
</div>

<script>

function getQueryParam(name) {
    const params = new URLSearchParams(window.location.search);
    const value = params.get(name);

    if (!value || value === "null" || value === "undefined") {
        return "";
    }

    return value.trim();
}

window.addEventListener("DOMContentLoaded", function () {
    const status = getQueryParam("status");
    const amount = getQueryParam("amount");

    const statusTextEl = document.getElementById("statusText");
    const amountTextEl = document.getElementById("amountText");

    statusTextEl.textContent = status || "Payment Status";

    if (amount) {
        amountTextEl.textContent = "Amount: " + amount;
        amountTextEl.style.display = "block";
    } else {
        amountTextEl.textContent = "";
        amountTextEl.style.display = "none";
    }
});

</script>

</body>
</html>
